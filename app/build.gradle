plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.example.countdownday'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.countdownday"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "10.2"
    }

    // 签名信息从环境变量或 keystore.properties 读取（均不入库）；
    // 缺失时回退到调试签名配置，保证 clone 后可直接构建 debug 包
    def ksProps = new Properties()
    def ksFile = rootProject.file("keystore.properties")
    if (ksFile.exists()) ksProps.load(new FileInputStream(ksFile))

    signingConfigs {
        release {
            storeFile file(ksProps.getProperty("storeFile") ?: System.getenv("KS_PATH") ?: "debug.keystore")
            storePassword ksProps.getProperty("storePassword") ?: System.getenv("KS_PASS") ?: ""
            keyAlias ksProps.getProperty("keyAlias") ?: System.getenv("KS_ALIAS") ?: ""
            keyPassword ksProps.getProperty("keyPassword") ?: System.getenv("KS_PASS") ?: ""
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.02')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    implementation 'androidx.navigation:navigation-compose:2.8.1'
}
